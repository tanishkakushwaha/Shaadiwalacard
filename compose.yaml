services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: shaadi
      POSTGRES_PASSWORD: shaadi_local_password
      POSTGRES_DB: shaadi_reply
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaadi -d shaadi_reply"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
